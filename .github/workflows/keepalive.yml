name: Mantener Supabase activo
# El plan gratuito pausa el proyecto tras 7 días sin actividad. Esta petición periódica lo evita.
# No se ha podido verificar que cuente como actividad; si el proyecto se pausa, se reactiva desde el panel.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: sb_publishable_l1O-QzlS6NleGh5rlgYTow_WgCUt70q" \
            "https://qmwysaducxbkbximwzxn.supabase.co/rest/v1/profiles?select=id&limit=1"
